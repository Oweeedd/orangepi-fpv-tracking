[control]
aux2_log_high_min=1400
aux3_low_value=172
aux3_mid_value=992
aux3_high_value=1811

throttle_min=172
throttle_max=1811
max_throttle_correction=100
throttle_slew_up_per_sec=160
throttle_slew_down_per_sec=70

sensor_min_cm=2.0
sensor_max_cm=120.0
sensor_fresh_ms=250

hold_kp=5.0
hold_ki=2.6
hold_kd=2.5
vel_k=1.8
integral_limit=20.0

land_descent_rate_cm_per_sec=0.25
target_capture_min_cm=3.0
target_capture_max_cm=110.0

throttle_stick_deadband=25
throttle_stick_max_delta=250
hold_target_slew_cm_per_sec=5.0

near_ground_cm=18.0
near_ground_max_correction=45
force_off_on_stale_sensor=true

[logging]
enabled_by_default=false
log_dir=/home/orangepi/crsf_logs
flush_every_rows=10
