model_path: models/yolo8n_416_test3

source: /dev/video1

imgsz: 416
conf: 0.25
iou: 0.45
max_det: 30

camera:
  width: 640
  height: 480
  fps: 30

serial:
  rx_port: /dev/ttyS2
  fc_port: /dev/ttyS6
  baudrate: 420000

channels:
  # 0-based индексы CRSF:
  # CH1 roll     -> 0
  # CH2 pitch    -> 1
  # CH3 throttle -> 2
  # CH4 yaw      -> 3
  # CH5 AUX1     -> 4
  # CH6 AUX2     -> 5
  # CH7 AUX3     -> 6
  # CH8 AUX4     -> 7
  roll: 0
  pitch: 1
  throttle: 2
  yaw: 3
  aux4: 7

aux:
  aux4_on_threshold_us: 1700

control:
  kp_yaw: 0.35
  kp_pitch: 0.25

  deadzone_x: 0.05
  deadzone_y: 0.05

  max_yaw: 0.30
  max_pitch: 0.25

  alpha: 0.30

  invert_yaw: false
  invert_pitch: false

mixing:
  # ВАЖНО:
  # false = только passthrough + preview на экране
  # true  = при AUX4 ON реально подмешивает auto_yaw/auto_pitch в CRSF
  enabled: false

  max_auto_yaw: 0.25
  max_auto_pitch: 0.20

  # Если пилот сильно двигает стик, можно ослаблять автокоррекцию.
  # Пока оставим 1.0 — без ослабления.
  pilot_override_threshold: 0.60
  pilot_override_factor: 0.40

failsafe:
  # Если цель потеряна — автокоррекция плавно уходит в 0.
  lost_target_decay: 0.85

ui:
  window_name: Tracking CRSF Lab
  draw_all_boxes: true
  draw_debug: true
  draw_crsf_panel: true
  record_on_start: false

classes:
  # Для старой COCO-модели можешь оставить пусто:
  allowed: []

  # Для VisDrone-модели можно будет так:
  # allowed:
  #   - pedestrian
  #   - people
  #   - car
  #   - van
  #   - truck
  #   - bus
  #   - motor
